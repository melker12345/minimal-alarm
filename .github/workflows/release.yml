name: release

# Push a tag like v1.2.0 to build a signed APK and publish it as a GitHub
# Release. The app's update gate reads releases/latest and forces the update.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Restore release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=minimal-alarm
          keyPassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          EOF

      - name: Build signed APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./android/gradlew -p android assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$GITHUB_RUN_NUMBER"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "minimal-alarm-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "minimal-alarm-$VERSION.apk" \
            --title "Minimal Alarm $VERSION" --generate-notes
